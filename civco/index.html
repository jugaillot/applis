<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier Civco</title>
<script src="../lib/sync.js"></script>
<style>
:root{--bg:#f1efea;--panel:#fff;--ink:#1d1d1f;--mute:#77756f;--line:#e3e0d9;--acc:#7a8a1f;--soft:#f7f6f2}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;font-weight:700}
header h1 a{color:inherit;text-decoration:none}
header h1 span{color:var(--acc)}
.sp{flex:1}
.muted{color:var(--mute);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:5px 9px;border-radius:7px;font:inherit;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#c9c5bc}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#board{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.06);max-width:calc(100% - 32px);max-height:calc(100% - 32px)}
#hello{position:absolute;text-align:center;color:var(--mute);pointer-events:none}
#hello b{display:block;font-size:20px;color:var(--ink);margin-bottom:6px}
</style>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#1d1d1f">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<script>if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(r=>r.update()).catch(()=>{}));
/* une nouvelle version vient d'être installée : on recharge une fois pour l'afficher */
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!sessionStorage.getItem('atelier-maj')){try{sessionStorage.setItem('atelier-maj','1');}catch(e){}location.reload();}});}
/* une erreur au démarrage ne laisse plus une page vide : on l'affiche, avec un moyen de repartir */
setTimeout(()=>{window.__bootOk=true;},10000);
window.addEventListener('error',e=>{if(window.__bootOk)return;const m=(e&&e.message)||'erreur';const d=document.getElementById('bootErr')||document.body&&document.body.appendChild(Object.assign(document.createElement('div'),{id:'bootErr'}));if(!d)return;d.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#fff3f0;border:1px solid #e3a59a;border-radius:10px;padding:10px 14px;font:13px system-ui;color:#5a1d12;box-shadow:0 6px 24px rgba(0,0,0,.15)';d.innerHTML='<b>Le démarrage a rencontré un problème</b> : '+String(m).replace(/</g,'&lt;')+'<br><button onclick="location.reload()" style="margin-top:6px">Recharger</button>';});</script>
</head>
<body>
<header>
  <h1><a href="../">Atelier</a> <span>Civco</span></h1>
  <span class="muted" id="docName"></span>
  <span class="sp"></span>
  <button class="btn" id="bNew">Nouvelle partie</button>
  <span id="syncBadge"></span>
  <button class="btn" id="bOpen">Mes parties…</button>
  <button class="btn primary" id="bSave">Enregistrer</button>
</header>
<main>
  <canvas id="board" width="960" height="640"></canvas>
  <div id="hello"><b>Civco</b>Civilisation et coopération — le jeu arrive ici.</div>
</main>
<script>
/* Civco — coquille de départ : état de partie, enregistrement / ouverture via l'Atelier.
   Le jeu lui-même se développe à partir d'ici. */
const $=s=>document.querySelector(s);
const APP='civco';
let G=null,DOC={id:null,name:''};
function newGame(){G={v:1,tour:1};DOC={id:null,name:''};showDoc();draw();}
function showDoc(){$('#docName').textContent=DOC.name?'· '+DOC.name:'';document.title='Atelier Civco'+(DOC.name?' — '+DOC.name:'');}
function draw(){const c=$('#board'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);}
async function save(){if(!window.AtelierSync)return alert('Enregistrement indisponible.');
  if(!DOC.name){const n=prompt('Nom de la partie :','Partie du '+new Date().toLocaleDateString('fr-FR'));if(!n)return;DOC.name=n.trim();}
  DOC.id=await AtelierSync.save(APP,DOC.id,DOC.name,G);showDoc();}
$('#bNew').onclick=()=>{if(confirm('Commencer une nouvelle partie ?'))newGame();};
$('#bSave').onclick=save;
$('#bOpen').onclick=()=>window.AtelierSync&&AtelierSync.openDialog({app:APP,title:'Mes parties',onOpen:(id,data,inf)=>{G=data;DOC={id,name:inf?inf.name:''};showDoc();draw();}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();}});
if(window.AtelierSync)$('#syncBadge').appendChild(AtelierSync.badge());
newGame();
</script>
<script src="../lib/help.js"></script>
<script>AtelierHelp.init({app:"civco",title:"Atelier Civco",sections:[{title:"Partie",keys:[["Ctrl + S","Enregistrer la partie"]]}]});</script>
</body>
</html>
