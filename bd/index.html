m2.onclick=()=>{mode='ed';m2.className='on';m1.className='';render()};

t2.onclick=()=>{t2.className='on';t1.className='';v2.hidden=false;v1.hidden=true};
let stream=null,timer=null;
function stop(){clearInterval(timer);timer=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}vid.hidden=true}
async function scan(){
 if(!('BarcodeDetector'in window)){hint.textContent='Le scan n’est pas disponible sur ce navigateur : saisis le code à la main.';return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(e){hint.textContent='Accès à la caméra refusé.';return}
 hint.textContent='Place le code-barres devant la caméra…';
 vid.srcObject=stream;vid.hidden=false;await vid.play();
 const det=new BarcodeDetector({formats:['ean_13','ean_8']});
 timer=setInterval(async()=>{try{const c=await det.detect(vid);if(c.length){const v=c[0].rawValue;stop();hint.textContent='';check(v)}}catch(e){}},300);
}
go.onclick=()=>{stop();scan()};
ok.onclick=()=>{const v=man.value.replace(/[^0-9Xx]/g,'');if(v)check(v)};
function check(ean){
 man.value=ean;
 const f=D().find(x=>x[3]===ean);
 if(f){
  const same=D().filter(x=>x[0]===f[0]),mq=manque(same);
  res.innerHTML=`<div class="res ok"><h3>Tu l’as déjà ✓</h3>${esc(f[0])}${f[1]!=null?' — tome '+f[1]:''}<br>${esc(f[2])}<div class="m">${same.length} album${same.length>1?'s':''} dans cette série${mq.length?'. Manque : tome'+(mq.length>1?'s ':' ')+mq.join(', '):''}</div></div>`;
  return}
 res.innerHTML=`<div class="res no"><h3>Pas dans ta collection</h3><span id="inf">Recherche du titre…</span><div id="add"></div></div>`;
 fetch('https://www.googleapis.com/books/v1/volumes?q=isbn:'+ean).then(r=>r.json()).then(j=>{
  const v=j.items&&j.items[0]&&j.items[0].volumeInfo;
  document.getElementById('inf').innerHTML=v?esc(v.title+(v.authors?' — '+v.authors.join(', '):'')):'Titre introuvable pour ce code ('+esc(ean)+').';
  const sg=v?v.title:'';
  document.getElementById('add').innerHTML=`<div class="m">Série voisine déjà possédée ? Tape son nom pour voir où tu en es :</div><div class="row"><input id="ns" placeholder="Série" value=""><input id="nt" inputmode="numeric" placeholder="Tome" style="max-width:80px"></div><div class="row"><button class="btn" id="chk">Voir la série</button><button class="btn pri" id="addb">Ajouter</button></div><div id="sr"></div>`;
  document.getElementById('chk').onclick=()=>{const s=norm(ns.value);const l=D().filter(x=>norm(x[0])===s);sr.innerHTML=l.length?`<div class="m">${l.length} album(s) possédés${manque(l).length?'. Manque : '+manque(l).join(', '):''}</div>`:'<div class="m">Série inconnue.</div>'};
  document.getElementById('addb').onclick=()=>{const s=ns.value.trim()||sg,t=parseInt(nt.value)||null;AJ.push([s,t,sg||s,ean,'']);localStorage.setItem('bd_ajouts',JSON.stringify(AJ));res.innerHTML='<div class="res ok"><h3>Ajouté sur ce téléphone ✓</h3>'+esc(s)+'</div>';render()};
 }).catch(()=>{inf.textContent='Pas de réseau : titre non vérifié.'});
}
render();
</script></body></html>
