<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Suite — Cahier</title>
<meta name="theme-color" content="#1d1d1f">
<link rel="icon" href="/icons/icon-192.png">
<style>
:root{--bg:#f1efea;--panel:#fff;--ink:#1d1d1f;--mute:#77756f;--line:#e3e0d9;--acc:#c0562b;--soft:#f7f6f2}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:16px;margin:0}header h1 a{color:inherit;text-decoration:none}header h1 span{color:var(--mute);font-weight:400}
.sp{flex:1}
.btn{font:inherit;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:7px 12px;color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn:disabled{opacity:.4}
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;border:0;background:none;border-radius:8px;padding:5px 11px;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
main{flex:1;min-height:0;position:relative}
/* feuilleter */
#view{position:absolute;inset:0 0 0 50px;display:flex;flex-direction:column}
#tb{position:absolute;left:0;top:0;bottom:0;width:50px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;z-index:5}
#tb button{width:40px;height:40px;border:1px solid transparent;border-radius:10px;background:none;cursor:pointer;color:var(--mute);display:flex;align-items:center;justify-content:center;padding:0}
#tb button.on{background:var(--ink);color:#fff}#tb button svg{width:22px;height:22px}
#slider.zone{overflow-x:hidden;cursor:crosshair;scroll-snap-type:none}#slider.zone .slide img{touch-action:none;-webkit-user-drag:none;user-select:none}
#selBox{position:fixed;border:2px dashed var(--acc);background:rgba(192,86,43,.14);z-index:40;pointer-events:none}
#zbar{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:41;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 4px 18px rgba(0,0,0,.25);max-width:94vw}
.cell[draggable=true]{cursor:grab}.cell.over{outline:3px solid var(--acc)}
#slider{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;background:#d9d5cc}
#slider::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;padding:10px;position:relative}
.slide img{max-width:100%;max-height:100%;box-shadow:0 2px 14px rgba(0,0,0,.3);background:#fff;touch-action:pan-x pinch-zoom}
.slide .ph{color:var(--mute)}
#nav{display:flex;align-items:center;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#nav .info{flex:1;min-width:0;text-align:center}
#nav .info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav .info span{color:var(--mute);font-size:12px}
.arr{font-size:22px;line-height:1;padding:6px 14px}
/* planche */
#grid{position:absolute;inset:0 0 0 50px;overflow:auto;padding:12px}
#tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#q{font:inherit;flex:1;min-width:140px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}
#cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.cell img{width:100%;aspect-ratio:var(--ar,.7);object-fit:cover;background:#eee;display:block}
.cell div{padding:5px 8px;font-size:12px}.cell b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell span{color:var(--mute)}
.cell.sk{border-color:var(--acc)}
.empty{color:var(--mute);text-align:center;padding:40px 16px}
/* fenêtres */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(520px,94vw);max-height:92vh;font:inherit;color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .h{padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700}
dialog .b{padding:12px 16px;overflow:auto;max-height:68vh}
dialog .f{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
dialog label{display:block;margin:0 0 9px;font-size:13px}dialog label>span{display:block;color:var(--mute);font-size:12px;margin-bottom:2px}
dialog input[type=text],dialog input[type=number],dialog input[type=date],dialog select,dialog textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
dialog .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.muted{color:var(--mute);font-size:12.5px}
#crop{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;z-index:30}
#crop .top{color:#ddd;padding:9px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#cBox{flex:1;position:relative;touch-action:none}#cCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#crop .bar{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#1d1d1f;flex-wrap:wrap}
#crop .btn{background:#2c2c2e;border-color:#3a3a3c;color:#fff}#crop .btn.acc{background:var(--acc);border-color:var(--acc);flex:1}
#crop select{font:inherit;padding:5px;border-radius:7px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:60;color:#fff;font-weight:600;text-align:center;padding:20px}
</style>
</head>
<body>
<header>
  <h1><a href="../">La Suite</a> <span>Cahier</span></h1>
  <button class="btn" id="bName" title="Mes cahiers">📓 …</button>
  <span class="seg" id="mode"><button data-m="view" class="on">Feuilleter</button><button data-m="grid">Planche</button></span>
  <span class="sp"></span>
  <button class="btn acc" id="bAdd" title="Photographier ou importer des pages">＋ Ajouter des pages</button>
  <button class="btn" id="bGal" title="Choisir des photos déjà prises" hidden>🖼</button>
  <span id="bdg"></span>
</header>
<main>
  <div id="tb"><button id="tHand" class="on" title="Feuilleter (glisser pour tourner les pages)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V5.5a1.5 1.5 0 0 1 3 0V11m0-1V4.5a1.5 1.5 0 0 1 3 0V11m0-4.5a1.5 1.5 0 0 1 3 0V13m0-3.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1.5a6 6 0 0 1-4.7-2.3L4 15.5a1.6 1.6 0 0 1 2.4-2L8 15"/></svg></button><button id="tZone" title="Zone : entoure une partie de la page (croquis…) pour l’envoyer vers une autre appli"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="9" y="9" width="6" height="6" rx="1" stroke-dasharray="2 2"/></svg></button></div>
  <div id="view">
    <div id="slider"></div>
    <div id="nav">
      <button class="btn arr" id="bPrev" title="Page précédente (←)">‹</button>
      <div class="info"><b id="nT">—</b><span id="nS"></span></div>
      <button class="btn" id="bInfo" title="Modifier les infos de cette page">Infos</button>
      <button class="btn arr" id="bNext" title="Page suivante (→)">›</button>
    </div>
  </div>
  <div id="grid" hidden>
    <div id="tools">
      <input id="q" type="search" placeholder="Chercher : titre, mot-clé, texte, date, n°…">
      <span class="seg" id="flt"><button data-t="all" class="on">Tout</button><button data-t="note">Notes</button><button data-t="croquis">Croquis</button></span>
      <button class="btn" id="bOcr" title="Lire automatiquement le texte écrit sur les pages (pour pouvoir le chercher)">Lire le texte…</button>
    </div>
    <div id="cells"></div>
  </div>
</main>
<input type="file" id="fIn" accept="image/*" multiple hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>

<!-- infos d'une page -->
<dialog id="dInfo"><div class="h">Infos de la page</div><div class="b">
  <div class="two"><label><span>Position dans le cahier</span><input type="number" id="iN" min="1"></label><label><span>Date</span><input type="date" id="iD"></label></div>
  <label><span>Type</span><select id="iT"><option value="note">Notes (texte)</option><option value="croquis">Croquis (dessin)</option></select></label>
  <label><span>Titre (tapé)</span><input type="text" id="iTitle" placeholder="Une phrase pour retrouver la page"></label>
  <label><span>Mots-clés (tapés, séparés par des espaces ou virgules)</span><input type="text" id="iTags"></label>
  <label><span>Texte lu automatiquement (modifiable)</span><textarea id="iOcr" rows="3"></textarea></label>
  <button class="btn" id="iRead">Lire le texte de cette page</button>
</div><div class="f"><button class="btn" id="iDel" style="margin-right:auto;color:#b3261e">Supprimer la page</button><button class="btn" id="iNo">Annuler</button><button class="btn primary" id="iOk">Enregistrer</button></div></dialog>


<!-- nouvelle page : infos -->
<dialog id="dNew"><div class="h" id="nwH">Nouvelle page</div><div class="b">
  <img id="nwImg" style="max-width:100%;max-height:34vh;display:block;margin:0 auto 10px;border:1px solid var(--line)">
  <label><span>Date</span><input type="date" id="nD"><small id="nDhint" class="muted"></small></label>
  <label><span>Type</span><select id="nT"><option value="note">Notes (texte)</option><option value="croquis">Croquis (dessin)</option></select></label>
  <label><span>Titre (tapé)</span><input type="text" id="nTitle"></label>
  <label><span>Mots-clés</span><input type="text" id="nTags"></label>
</div><div class="f"><button class="btn" id="nSkip">Ignorer cette photo</button><button class="btn primary" id="nOk">Ajouter au cahier</button></div></dialog>

<!-- redressement -->
<div id="crop" hidden>
  <div class="top"><span id="cMsg"></span><span class="sp"></span><label>Les 4 points sont <select id="cMode"><option value="rep">les croix</option><option value="page">les coins de la page</option></select></label></div>
  <div id="cBox"><canvas id="cCv"></canvas></div>
  <div class="bar"><button class="btn" id="cRot" title="Tourner la photo d’un quart de tour">⟳ Tourner</button><button class="btn" id="cNo">Ignorer</button><label style="color:#ddd;display:flex;align-items:center;gap:5px"><input type="checkbox" id="cClean" checked> Fond blanc</label><button class="btn acc" id="cOk">Redresser et continuer</button></div>
</div>
<div id="busy" hidden></div>

<script src="../lib/sync.js"></script>
<script src="../lib/save.js"></script>
<script src="../lib/drop.js"></script>
<script>
(function(){'use strict';
const $=s=>document.querySelector(s);
const ls={get:k=>{try{return localStorage.getItem(k);}catch(e){return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}}};
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function busy(t){$('#busy').textContent=t||'';$('#busy').hidden=!t;}
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const fdate=s=>{if(!s)return '';const [y,m,d]=s.split('-');return d+'/'+m+'/'+y;};
const nid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

/* ---------- le cahier ---------- */
let DOC=null,LIST=[],POS=0,saveT=0;
const blobKey=p=>'cahier.'+DOC.id+'.'+p.id;
function sorted(){return DOC.pages.slice();}
const pos=p=>DOC.pages.indexOf(p)+1;
function persist(now){clearTimeout(saveT);const go=()=>AtelierSync.save('cahier',DOC.id,DOC.name,DOC);if(now)return go();saveT=setTimeout(go,400);}
async function newDoc(){
  const name=prompt('Nom du cahier :','Mon cahier');if(!name)return;
  const d={id:AtelierSync.genId('cahier'),name,pages:[]};await openDoc(d.id,d);persist(true);
}
async function openDoc(id,data){
  DOC=Object.assign({pages:[]},data);DOC.id=id||DOC.id;
  if(DOC.pages.some(p=>p.n!=null)){DOC.pages.sort((a,b)=>((a.n||0)-(b.n||0))||((a.ts||0)-(b.ts||0)));DOC.pages.forEach(p=>{delete p.n;});persist();}// ancien classement par n° : devient l'ordre du cahier
ls.set('cahier.last',DOC.id);
  $('#bName').textContent='📓 '+DOC.name;
  refresh();go(0);
}
function chooser(){AtelierSync.openDialog({app:'cahier',title:'Mes cahiers',onOpen:(id,data)=>openDoc(id,data),extra:[{label:'＋ Nouveau cahier',action:newDoc}]});}
$('#bName').onclick=chooser;

/* ---------- affichage : feuilleter ---------- */
const URLS=new Map();
async function pageURL(p){const k=blobKey(p);if(URLS.has(k))return URLS.get(k);const b=await AtelierSync.getBlob(k);if(!b)return null;const u=URL.createObjectURL(b);URLS.set(k,u);return u;}
function buildSlides(){
  const sl=$('#slider');sl.innerHTML='';
  if(!LIST.length){sl.innerHTML='<div class="slide"><div class="ph empty">'+(DOC.pages.length?'Aucune page ne correspond.':'Ce cahier est vide.<br>Imprime des pages avec « Imprimer des pages… », écris dessus,<br>puis « Ajouter des pages » pour les photographier.')+'</div></div>';updNav();return;}
  LIST.forEach((p,i)=>{const s=document.createElement('div');s.className='slide';s.dataset.i=i;s.innerHTML='<span class="ph">…</span>';sl.appendChild(s);});
  io.disconnect();sl.querySelectorAll('.slide').forEach(s=>io.observe(s));
}
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)loadSlide(+e.target.dataset.i);});},{root:null,rootMargin:'0px 100% 0px 100%'});
async function loadSlide(i){const s=$('#slider').children[i];if(!s||s.dataset.ok)return;s.dataset.ok='1';const p=LIST[i];if(!p)return;
  const u=await pageURL(p);if(!u){s.innerHTML='<span class="ph">Image pas encore disponible (hors connexion ?)</span>';delete s.dataset.ok;return;}
  s.innerHTML='';const im=new Image();im.src=u;im.alt='Page '+pos(p);s.appendChild(im);}
function go(i,smooth){POS=Math.max(0,Math.min(LIST.length-1,i));const sl=$('#slider');if(!smooth)sl.style.scrollBehavior='auto';sl.scrollLeft=POS*sl.clientWidth;sl.style.scrollBehavior='';loadSlide(POS);loadSlide(POS+1);loadSlide(POS-1);updNav();}
$('#slider').addEventListener('scroll',()=>{clearTimeout(go.t);go.t=setTimeout(()=>{const sl=$('#slider');const i=Math.round(sl.scrollLeft/Math.max(1,sl.clientWidth));if(i!==POS){POS=Math.max(0,Math.min(LIST.length-1,i));updNav();}},60);});
function updNav(){const p=LIST[POS];$('#bPrev').disabled=POS<=0;$('#bNext').disabled=POS>=LIST.length-1;$('#bInfo').disabled=!p;
  $('#nT').textContent=p?(p.title||'Page '+pos(p)):'—';$('#nS').textContent=p?('p. '+pos(p)+' · '+fdate(p.date)+(p.type==='croquis'?' · croquis':'')+'  ('+(POS+1)+' / '+LIST.length+')'):'';}
$('#bPrev').onclick=()=>go(POS-1,true);$('#bNext').onclick=()=>go(POS+1,true);
addEventListener('keydown',e=>{if(document.querySelector('dialog[open]')||!$('#crop').hidden||$('#view').hidden)return;if(/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName))return;
  if(e.key==='ArrowLeft'){go(POS-1,true);e.preventDefault();}else if(e.key==='ArrowRight'||e.key===' '){go(POS+1,true);e.preventDefault();}else if(e.key==='Home')go(0);else if(e.key==='End')go(LIST.length-1);});

/* ---------- planche, filtre, recherche ---------- */
let FLT='all',QS='';
function matches(p){
  if(FLT!=='all'&&p.type!==FLT)return false;
  if(!QS)return true;
  const hay=norm([p.title,p.tags,p.ocr,p.date,fdate(p.date),'p'+pos(p),pos(p),p.type].join(' '));
  return QS.split(/\s+/).every(w=>hay.includes(w));
}
function refresh(keepPos){
  const cur=LIST[POS];LIST=sorted().filter(matches);
  buildSlides();renderGrid();
  const i=cur?LIST.findIndex(p=>p.id===cur.id):-1;go(i>=0?i:Math.min(POS,Math.max(0,LIST.length-1)));
}
function renderGrid(){
  const c=$('#cells');c.innerHTML='';
  if(!LIST.length){c.innerHTML='<div class="empty">'+(DOC&&DOC.pages.length?'Aucune page ne correspond à cette recherche.':'Ce cahier est vide.')+'</div>';return;}
  LIST.forEach((p,i)=>{const d=document.createElement('div');d.className='cell'+(p.type==='croquis'?' sk':'');
    d.innerHTML='<img alt=""><div><b></b><span></span></div>';const im=d.querySelector('img');im.src=p.thumb||'';if(p.ar)im.style.setProperty('--ar',p.ar);
    d.querySelector('b').textContent=p.title||('Page '+pos(p));d.querySelector('span').textContent='p. '+pos(p)+' · '+fdate(p.date);
    d.draggable=true;d.dataset.id=p.id;
    d.onclick=()=>{setMode('view');go(i);};c.appendChild(d);});
}
let DRAG=null;
$('#cells').addEventListener('dragstart',e=>{const c=e.target.closest('.cell');if(!c)return;DRAG=c.dataset.id;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',DRAG);}catch(x){}});
$('#cells').addEventListener('dragover',e=>{const c=e.target.closest('.cell');if(!c||!DRAG)return;e.preventDefault();document.querySelectorAll('.cell.over').forEach(x=>x.classList.remove('over'));c.classList.add('over');});
$('#cells').addEventListener('drop',e=>{const c=e.target.closest('.cell');document.querySelectorAll('.cell.over').forEach(x=>x.classList.remove('over'));if(!c||!DRAG||c.dataset.id===DRAG)return;e.preventDefault();
  const a=DOC.pages.find(p=>p.id===DRAG),b=DOC.pages.find(p=>p.id===c.dataset.id);DRAG=null;if(!a||!b)return;
  const to=DOC.pages.indexOf(b);DOC.pages=DOC.pages.filter(x=>x!==a);DOC.pages.splice(to,0,a);persist();refresh();});
$('#cells').addEventListener('dragend',()=>{DRAG=null;document.querySelectorAll('.cell.over').forEach(x=>x.classList.remove('over'));});
$('#q').addEventListener('input',()=>{QS=norm($('#q').value).trim();refresh();});
$('#flt').onclick=e=>{const b=e.target.closest('button');if(!b)return;FLT=b.dataset.t;$('#flt').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));refresh();};
function setMode(m){$('#view').hidden=m!=='view';$('#grid').hidden=m!=='grid';$('#mode').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));if(m==='view')requestAnimationFrame(()=>go(POS));}
$('#mode').onclick=e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.m);};

/* ---------- infos d'une page ---------- */
let EDIT=null;
function openInfo(p){EDIT=p;$('#iN').value=pos(p);$('#iD').value=p.date||'';$('#iT').value=p.type||'note';$('#iTitle').value=p.title||'';$('#iTags').value=p.tags||'';$('#iOcr').value=p.ocr||'';$('#dInfo').showModal();}
$('#bInfo').onclick=()=>{if(LIST[POS])openInfo(LIST[POS]);};
$('#iNo').onclick=()=>$('#dInfo').close();
$('#iOk').onclick=()=>{const p=EDIT;if(!p)return;const np=Math.max(1,Math.min(DOC.pages.length,+$('#iN').value||pos(p)));DOC.pages=DOC.pages.filter(x=>x!==p);DOC.pages.splice(np-1,0,p);p.date=$('#iD').value;p.type=$('#iT').value;p.title=$('#iTitle').value.trim();p.tags=$('#iTags').value.trim();p.ocr=$('#iOcr').value;$('#dInfo').close();persist();refresh();};
$('#iDel').onclick=()=>{if(!EDIT||!confirm('Supprimer la page '+pos(EDIT)+' ?'))return;DOC.pages=DOC.pages.filter(x=>x!==EDIT);$('#dInfo').close();persist();refresh();};
$('#iRead').onclick=async()=>{const p=EDIT;if(!p)return;busy('Lecture du texte…');try{$('#iOcr').value=await ocrPage(p);}catch(e){alert('Lecture impossible : '+(e.message||e));}busy();};

/* ---------- lecture automatique du texte (OCR), chargée à la demande ---------- */
let tessP=null;
function loadTess(){if(window.Tesseract)return Promise.resolve();return tessP||(tessP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';s.onload=res;s.onerror=()=>{tessP=null;rej(new Error('bibliothèque de lecture indisponible (connexion ?)'));};document.head.appendChild(s);}));}
async function ocrPage(p){await loadTess();const b=await AtelierSync.getBlob(blobKey(p));if(!b)throw new Error('image indisponible');const r=await Tesseract.recognize(b,'fra');return (r.data.text||'').replace(/\s+/g,' ').trim().slice(0,4000);}
$('#bOcr').onclick=async()=>{
  const todo=DOC.pages.filter(p=>!p.ocr);if(!todo.length){alert('Toutes les pages ont déjà leur texte lu.');return;}

/* détection des 4 croix tracées à la main (celle en haut à gauche est entourée) :
   on cherche, à plusieurs tailles, « de l'encre sur les 2 axes d'une croix et rien dans ses 4 coins » */
function detectMarkers(src){
  const sc=Math.min(1,1300/Math.max(src.width,src.height)),w=Math.round(src.width*sc),h=Math.round(src.height*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(src,0,0,w,h);
  const d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);for(let i=0;i<w*h;i++)g[i]=0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
  const I=new Float64Array((w+1)*(h+1));for(let j=0;j<h;j++){let r=0;for(let i=0;i<w;i++){r+=g[j*w+i];I[(j+1)*(w+1)+i+1]=I[j*(w+1)+i+1]+r;}}
  const R=Math.max(10,Math.round(Math.min(w,h)/10));const S=new Int32Array((w+1)*(h+1));
  for(let j=0;j<h;j++){const y0=Math.max(0,j-R),y1=Math.min(h,j+R+1);let row=0;for(let i=0;i<w;i++){const x0=Math.max(0,i-R),x1=Math.min(w,i+R+1);
    const s=I[y1*(w+1)+x1]-I[y0*(w+1)+x1]-I[y1*(w+1)+x0]+I[y0*(w+1)+x0],mean=s/((x1-x0)*(y1-y0)),v=g[j*w+i];
    row+=(v<mean*0.7&&v<140)?1:0;S[(j+1)*(w+1)+i+1]=S[j*(w+1)+i+1]+row;}}
  const box=(x0,y0,x1,y1)=>{x0=Math.max(0,Math.round(x0));y0=Math.max(0,Math.round(y0));x1=Math.min(w,Math.round(x1));y1=Math.min(h,Math.round(y1));if(x1<=x0||y1<=y0)return 0;return S[y1*(w+1)+x1]-S[y0*(w+1)+x1]-S[y1*(w+1)+x0]+S[y0*(w+1)+x0];};
  const big=Math.max(w,h),found=[];
  for(const L of [0.014,0.019,0.026,0.035,0.046].map(f=>Math.round(f*big))){
    const hf=L/2,t=Math.max(3,Math.round(L*0.2)),ht=t/2,cs=L*0.24,co=L*0.27,m=Math.round(L*0.3);
    const lineA=L*t,cornA=cs*cs;
    for(let y=m;y<h-m;y+=2)for(let xx=m;xx<w-m;xx+=2){
      const hl=box(xx-hf,y-ht,xx+hf,y+ht)/lineA;if(hl<0.55)continue;
      const vl=box(xx-ht,y-hf,xx+ht,y+hf)/lineA;if(vl<0.55)continue;
      const cn=(box(xx+co-cs/2,y+co-cs/2,xx+co+cs/2,y+co+cs/2)+box(xx-co-cs/2,y+co-cs/2,xx-co+cs/2,y+co+cs/2)+box(xx+co-cs/2,y-co-cs/2,xx+co+cs/2,y-co+cs/2)+box(xx-co-cs/2,y-co-cs/2,xx-co+cs/2,y-co+cs/2))/(4*cornA);
      const sco=Math.min(hl,vl)-1.7*cn;if(sco>0.38)found.push({x:xx,y,L,sco});}}
  if(found.length<4)return null;
  found.sort((a,b)=>b.sco-a.sco);const keep=[];
  for(const f of found){if(keep.every(k=>Math.hypot(k.x-f.x,k.y-f.y)>0.7*Math.max(k.L,f.L)))keep.push(f);if(keep.length>400)break;}
  const mx=w/2,my=h/2,diag=Math.hypot(w,h),quad=[[],[],[],[]];
  keep.forEach(f=>quad[(f.x<mx?0:1)+(f.y<my?0:2)].push(f));
  if(quad.some(q=>!q.length))return null;
  // cercle d'encre autour d'une croix (la croix entourée = haut gauche de la feuille)
  const ring=f=>{let best=0;for(const r of [0.42,0.5,0.58,0.66]){let n=0,N=24;for(let k=0;k<N;k++){const a=k*2*Math.PI/N,px=f.x+Math.cos(a)*r*f.L,py=f.y+Math.sin(a)*r*f.L;n+=box(px-1.5,py-1.5,px+1.5,py+1.5)>0?1:0;}best=Math.max(best,n/N);}return best;};
  const top=quad.map(q=>q.slice(0,7));top.forEach(q=>q.forEach(f=>{f.ring=ring(f);}));
  // on choisit l'ensemble de 4 croix le plus cohérent : bons scores, grand quadrilatère presque parallélogramme, tailles voisines, une seule croix entourée
  let best=null,bv=-1e9;
  for(const A of top[0])for(const B of top[1])for(const C of top[2])for(const D of top[3]){
    const Ls=[A.L,B.L,C.L,D.L],lr=Math.max(...Ls)/Math.min(...Ls);if(lr>2.1)continue;
    const par=Math.hypot(A.x+D.x-B.x-C.x,A.y+D.y-B.y-C.y)/diag;
    const area=Math.abs((B.x-A.x)*(C.y-A.y)-(C.x-A.x)*(B.y-A.y))/2+Math.abs((B.x-D.x)*(C.y-D.y)-(C.x-D.x)*(B.y-D.y))/2;
    const rs=[A.ring,B.ring,C.ring,D.ring].sort((p,q)=>q-p);
    const v=(A.sco+B.sco+C.sco+D.sco)+1.4*(rs[0]-rs[1])-6*par+2.2*area/(w*h)-0.4*lr;
    if(v>bv){bv=v;best=[A,B,C,D];}}
  if(!best)return null;
  // si la croix la moins sûre est loin de l'endroit prévu par les 3 autres, on cherche une meilleure croix près de cet endroit
  {const ix=[0,1,2,3].sort((p,q)=>best[p].sco-best[q].sco)[0],o=[0,1,2,3].filter(i=>i!==ix),opp={0:3,3:0,1:2,2:1}[ix],adj=o.filter(i=>i!==opp);
   const px=best[adj[0]].x+best[adj[1]].x-best[opp].x,py=best[adj[0]].y+best[adj[1]].y-best[opp].y,tol=0.05*diag;
   if(Math.hypot(best[ix].x-px,best[ix].y-py)>tol){const c=keep.filter(f=>Math.hypot(f.x-px,f.y-py)<tol&&f.sco>0.3).sort((a,b)=>b.sco-a.sco)[0];if(c){c.ring=ring(c);best=best.slice();best[ix]=c;}}}
  const four=best.slice(),cx=four.reduce((s,f)=>s+f.x,0)/4,cy=four.reduce((s,f)=>s+f.y,0)/4;
  four.sort((a,b)=>Math.atan2(a.y-cy,a.x-cx)-Math.atan2(b.y-cy,b.x-cx));   // sens horaire à l'écran
  let bi=0;four.forEach((f,i)=>{if(f.ring>four[bi].ring)bi=i;});
  return [0,1,2,3].map(i=>four[(bi+i)%4]).map(f=>[f.x/sc,f.y/sc]);
}
/* fenêtre de redressement */
function draw(){const cv=$('#cCv'),box=$('#cBox').getBoundingClientRect(),dpr=devicePixelRatio||1;cv.width=Math.round(box.width*dpr);cv.height=Math.round(box.height*dpr);
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,box.width,box.height);if(!PH.img)return;
  const pad=24,k=Math.min((box.width-2*pad)/PH.img.width,(box.height-2*pad)/PH.img.height);PH.k=k;PH.ox=(box.width-PH.img.width*k)/2;PH.oy=(box.height-PH.img.height*k)/2;
  x.drawImage(PH.img,PH.ox,PH.oy,PH.img.width*k,PH.img.height*k);const P=PH.q.map(([a,b])=>[PH.ox+a*k,PH.oy+b*k]);
  x.beginPath();P.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.strokeStyle='#ff7a3d';x.lineWidth=2;x.stroke();
  P.forEach((p,i)=>{x.beginPath();x.arc(p[0],p[1],i?13:17,0,Math.PI*2);x.fillStyle='rgba(255,255,255,.88)';x.fill();x.lineWidth=2.5;x.strokeStyle='#ff7a3d';x.stroke();x.beginPath();x.arc(p[0],p[1],3,0,Math.PI*2);x.fillStyle='#ff7a3d';x.fill();});}
function pt(e){const r=$('#cCv').getBoundingClientRect();return [(e.clientX-r.left-PH.ox)/PH.k,(e.clientY-r.top-PH.oy)/PH.k];}

/* redressement : les 4 points (repères ou coins) deviennent un rectangle aux proportions de la feuille */
function warp(img,q,Wo,Ho,mi){
  const [p0,p1,p2,p3]=q;
  const x0=p0[0],y0=p0[1],x1=p1[0],y1=p1[1],x2=p2[0],y2=p2[1],x3=p3[0],y3=p3[1];
  const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;
  let g=0,h=0;if(Math.abs(dx3)>1e-9||Math.abs(dy3)>1e-9){const den=dx1*dy2-dx2*dy1;g=(dx3*dy2-dx2*dy3)/den;h=(dx1*dy3-dx3*dy1)/den;}
  const a=x1-x0+g*x1,b=x3-x0+h*x3,c=x0,d=y1-y0+g*y1,e=y3-y0+h*y3,f=y0;
  const sw=img.width,sh=img.height,src=img.getContext('2d').getImageData(0,0,sw,sh).data;
  const out=document.createElement('canvas');out.width=Wo;out.height=Ho;const ox=out.getContext('2d');const od=ox.createImageData(Wo,Ho),o=od.data;
  const iw=Wo-2*mi,ih=Ho-2*mi;
  for(let j=0;j<Ho;j++){const v=(j+0.5-mi)/ih;for(let i=0;i<Wo;i++){const u=(i+0.5-mi)/iw,z=g*u+h*v+1;let sx=(a*u+b*v+c)/z-0.5,sy=(d*u+e*v+f)/z-0.5;
    if(sx<0)sx=0;if(sy<0)sy=0;if(sx>sw-1.001)sx=sw-1.001;if(sy>sh-1.001)sy=sh-1.001;
    const ix=sx|0,iy=sy|0,fx=sx-ix,fy=sy-iy,qq=(iy*sw+ix)*4,q2=qq+sw*4,t=(j*Wo+i)*4;
    for(let ch=0;ch<3;ch++){const tp=src[qq+ch]+(src[qq+4+ch]-src[qq+ch])*fx,bt=src[q2+ch]+(src[q2+4+ch]-src[q2+ch])*fx;o[t+ch]=tp+(bt-tp)*fy;}o[t+3]=255;}}
  ox.putImageData(od,0,0);return out;
}
/* fond de la feuille ramené au blanc : on estime la couleur du papier localement (zones sans trait), puis on divise */
function whiten(c){const w=c.width,h=c.height,x=c.getContext('2d'),im=x.getImageData(0,0,w,h),d=im.data;
  const K=14,gw=Math.ceil(w/K),gh=Math.ceil(h/K),bg=[new Float32Array(gw*gh),new Float32Array(gw*gh),new Float32Array(gw*gh)];
  for(let ch=0;ch<3;ch++){const m=new Float32Array(gw*gh);
    for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){const v=[];for(let j=0;j<K;j+=3)for(let i=0;i<K;i+=3){const X=Math.min(w-1,gx*K+i),Y=Math.min(h-1,gy*K+j);v.push(d[(Y*w+X)*4+ch]);}v.sort((p,q)=>p-q);m[gy*gw+gx]=v[Math.floor(v.length*0.85)];}
    const e=new Float32Array(gw*gh);                           // maximum local (ignore les traits) puis flou
    for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){let mx=0;for(let j=-2;j<=2;j++)for(let i=-2;i<=2;i++){const X=Math.max(0,Math.min(gw-1,gx+i)),Y=Math.max(0,Math.min(gh-1,gy+j));mx=Math.max(mx,m[Y*gw+X]);}e[gy*gw+gx]=mx;}
    for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){let sm=0,n=0;for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){const X=Math.max(0,Math.min(gw-1,gx+i)),Y=Math.max(0,Math.min(gh-1,gy+j));sm+=e[Y*gw+X];n++;}bg[ch][gy*gw+gx]=Math.max(60,sm/n);}}
  for(let y=0;y<h;y++){const fy=Math.max(0,Math.min(gh-1.001,y/K-0.5)),y0=fy|0,ty=fy-y0;
    for(let xx=0;xx<w;xx++){const fx=Math.max(0,Math.min(gw-1.001,xx/K-0.5)),x0=fx|0,tx=fx-x0,t=(y*w+xx)*4;
      for(let ch=0;ch<3;ch++){const B=bg[ch],b=(B[y0*gw+x0]*(1-tx)+B[y0*gw+x0+1]*tx)*(1-ty)+(B[(y0+1)*gw+x0]*(1-tx)+B[(y0+1)*gw+x0+1]*tx)*ty;
        const r=d[t+ch]/b,o=(r-0.22)/0.72;d[t+ch]=o<=0?0:o>=1?255:Math.round(255*(o*o*(3-2*o)*0.55+o*0.45));}}}
  x.putImageData(im,0,0);}

/* date manuscrite à côté de la croix du haut à gauche (lecture automatique, à vérifier) */
const MOIS=['janv','fevr','mars','avr','mai','juin','juil','aout','sept','oct','nov','dec'];
function parseDate(t,ref){
  t=norm(t).replace(/\s+/g,' ');for(let k=0;k<2;k++)t=t.replace(/(?<=\d)[o]|[o](?=\d)/g,'0').replace(/(?<=\d)[il|]|[il|](?=\d)/g,'1');// lettres prises pour des chiffres, seulement au contact d'un chiffre
  const now=ref||new Date();let d,m,y,r;
  if((r=t.match(/(\d{1,2})\s*[\/.\- ]\s*(\d{1,2})\s*[\/.\- ]\s*(\d{4}|\d{2})\b/))){d=+r[1];m=+r[2];y=+r[3];}
  else if((r=t.match(/(\d{1,2})\s*(?:er)?\s*([a-z]{3,9})\.?\s*(\d{4}|\d{2})?\b/))){const k=MOIS.findIndex(x=>r[2].startsWith(x.slice(0,3)));if(k>=0){d=+r[1];m=k+1;y=r[3]?+r[3]:null;}}
  else if((r=t.match(/(\d{1,2})\s*[\/.\-]\s*(\d{1,2})\b/))){d=+r[1];m=+r[2];}
  if(!d||!m||d>31||m>12)return '';
  if(y==null)y=now.getFullYear();else if(y<100)y+=2000;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

    const r=await Tesseract.recognize(c,'fra');const dt=parseDate(r.data.text||'');

  }catch(e){}
}

/* ---------- barre d'outils : Zone (entourer une partie de la page pour l'envoyer ailleurs) ---------- */
let TOOL='hand',ZR=null,ZD=null;
function setTool(t){TOOL=t;$('#tHand').classList.toggle('on',t==='hand');$('#tZone').classList.toggle('on',t==='zone');$('#slider').classList.toggle('zone',t==='zone');if(t!=='zone')zoneClear();else{if($('#view').hidden)setMode('view');go(POS);}}
$('#tHand').onclick=()=>setTool('hand');$('#tZone').onclick=()=>{if($('#view').hidden)setMode('view');setTool('zone');};
function curImg(){const s=$('#slider').children[POS];return s&&s.querySelector('img');}
function zoneClear(){ZR=null;ZD=null;const b=$('#selBox');if(b)b.remove();const z=$('#zbar');if(z)z.remove();}
$('#slider').addEventListener('pointerdown',e=>{if(TOOL!=='zone')return;const im=curImg();if(!im)return;const r=im.getBoundingClientRect();
  if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;
  zoneClear();ZD={x:e.clientX,y:e.clientY,r};$('#slider').setPointerCapture(e.pointerId);
  const b=document.createElement('div');b.id='selBox';document.body.appendChild(b);e.preventDefault();});
$('#slider').addEventListener('pointermove',e=>{if(!ZD)return;const r=ZD.r,x0=Math.max(r.left,Math.min(r.right,ZD.x)),y0=Math.max(r.top,Math.min(r.bottom,ZD.y)),x1=Math.max(r.left,Math.min(r.right,e.clientX)),y1=Math.max(r.top,Math.min(r.bottom,e.clientY));
  ZD.box=[Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0)];const b=$('#selBox');b.style.left=ZD.box[0]+'px';b.style.top=ZD.box[1]+'px';b.style.width=ZD.box[2]+'px';b.style.height=ZD.box[3]+'px';});
$('#slider').addEventListener('pointerup',()=>{if(!ZD)return;const bx=ZD.box,r=ZD.r;ZD=null;if(!bx||bx[2]<10||bx[3]<10){zoneClear();return;}
  ZR={p:LIST[POS],x:(bx[0]-r.left)/r.width,y:(bx[1]-r.top)/r.height,w:bx[2]/r.width,h:bx[3]/r.height};
  const z=document.createElement('div');z.id='zbar';z.innerHTML='<button class="btn primary" data-a="xfer">Transférer vers…</button><button class="btn" data-a="save">Enregistrer l’image</button><button class="btn" data-a="copy">Copier</button><button class="btn" data-a="no">✕</button>';document.body.appendChild(z);
  z.onclick=async ev=>{const a=ev.target.dataset.a;if(!a)return;if(a==='no'){zoneClear();return;}await zoneAct(a);};});
async function zoneBlob(){const zr=ZR;if(!zr)return null;const b=await AtelierSync.getBlob(blobKey(zr.p));if(!b)return null;const bm=await createImageBitmap(b);
  const sx=Math.round(zr.x*bm.width),sy=Math.round(zr.y*bm.height),sw=Math.max(1,Math.round(zr.w*bm.width)),sh=Math.max(1,Math.round(zr.h*bm.height));
  const c=document.createElement('canvas');c.width=sw;c.height=sh;c.getContext('2d').drawImage(bm,sx,sy,sw,sh,0,0,sw,sh);
  return new Promise(r=>c.toBlob(r,'image/png'));}
async function zoneAct(a){const nm='cahier-p'+pos(ZR.p)+'-zone.png';
  if(a==='xfer'){const zr=ZR;await AtelierDrop.transfer('cahier',nm,'image/png',async()=>{ZR=zr;const b=await zoneBlob();return b?new File([b],nm,{type:'image/png'}):null;});return;}
  busy('Découpe…');const b=await zoneBlob();busy();if(!b){alert('Image indisponible.');return;}
  if(a==='save'){await AtelierSave.save(b,nm);}
  else{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);$('#zbar').firstChild.textContent='Copié ✓';}catch(e){alert('Copie impossible : '+(e.message||e));}}}
addEventListener('keydown',e=>{if(e.key==='Escape'&&TOOL==='zone'){if(ZR||ZD)zoneClear();else setTool('hand');}});
$('#slider').addEventListener('scroll',()=>{if(ZR)zoneClear();});

/* ---------- démarrage ---------- */
if(window.AtelierDrop)AtelierDrop.init({accept:()=>false});
window.__cahier={detectMarkers,warp,parseDate,cur:()=>CUR};
(async()=>{
  $('#bdg').appendChild(AtelierSync.badge());
  const last=ls.get('cahier.last');let data=null;
  if(last){try{data=await AtelierSync.load(last);}catch(e){}}
  if(data)return openDoc(last,data);
  const items=await AtelierSync.list('cahier');
  if(items.length){const d=await AtelierSync.load(items[0].id);if(d)return openDoc(items[0].id,d);}
  DOC={id:'',name:'',pages:[]};LIST=[];buildSlides();$('#bName').textContent='📓 Choisir un cahier';
  setTimeout(()=>{if(!DOC.id){if(confirm('Créer ton premier cahier ?'))newDoc();else chooser();}},300);
})();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).catch(()=>{}));
})();
</script>
</body></html>
