<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C2410C">
<title>Mon espace — La Raffinerie</title>
<link rel="icon" href="/icons/raffinerie-icon-192.png">
<link rel="apple-touch-icon" href="/icons/raffinerie-icon-192.png">
<link rel="manifest" href="/p/mon-espace/manifest.webmanifest">
<style>
html,body{margin:0;background:#FBF7F0;color:#1A1815;font-family:system-ui,sans-serif}
main{max-width:420px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 22px 30px;text-align:center}
img{width:96px;height:96px;border-radius:22px}
h1{font-size:24px;margin:14px 0 6px}
p{font-size:14px;color:#6f6554;line-height:1.5;margin:0 0 14px}
a.b,button{display:block;width:100%;box-sizing:border-box;margin-top:12px;padding:15px;border:0;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;text-decoration:none}
.main{background:#C2410C;color:#fff}
.alt{background:#fff;color:#C2410C;border:1px solid #C2410C!important}
.how{margin-top:16px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid #EFE7D8;font-size:13px;line-height:1.5;text-align:left;color:#1A1815}
</style>
<script>
var GRIST_URL='https://base.tierslieux.re/o/laraffinerie/huQs66KK4eZ2/Tableau-de-bord/p/125';
var standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
/* application installée (ou lancement explicite) : on ouvre directement Grist */
if(standalone||/[?&]lancer=1/.test(location.search)){location.replace(GRIST_URL);}
var bip=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();bip=e;var b=document.getElementById('bi');if(b)b.style.display='block';});
window.addEventListener('appinstalled',function(){var b=document.getElementById('bi');if(b)b.style.display='none';});
if('serviceWorker' in navigator)navigator.serviceWorker.register('/p/mon-espace/sw.js',{scope:'/p/mon-espace/'}).catch(function(){});
</script>
</head>
<body><main>
<img src="/icons/raffinerie-icon-192.png" alt="">
<h1>Mon espace</h1>
<p>Tes tâches, tensions, agenda et deck chantier de La Raffinerie. Une fois installée, l'icône ouvre directement Mon espace : tu te connectes avec ton compte Grist habituel.</p>
<button class="main" id="bi" style="display:none" onclick="if(bip){bip.prompt();bip.userChoice.then(function(){bip=null;});}">Installer l'appli</button>
<div class="how" id="how"></div>
<a class="b alt" href="https://base.tierslieux.re/o/laraffinerie/huQs66KK4eZ2/Tableau-de-bord/p/125">Ouvrir sans installer</a>
</main>
<script>
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
document.getElementById('how').innerHTML=ios
 ?'Sur iPhone / iPad : touche <b>Partager</b> puis <b>Sur l’écran d’accueil</b>.'
 :'Si le bouton ne s’affiche pas : ouvre le menu du navigateur (<b>⋮</b>) puis touche <b>Installer l’application</b> (ou <b>Ajouter à l’écran d’accueil</b>).';
</script>
</body></html>
