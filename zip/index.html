<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>La Suite Zip</title>
<script src="../lib/fflate.min.js"></script>
<style>
:root{--bg:#f1efea;--panel:#fff;--ink:#1d1d1f;--mute:#77756f;--line:#e3e0d9;--acc:#5b6cf0;--soft:#f7f6f2}
*{box-sizing:border-box}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0}header a{color:var(--mute);text-decoration:none}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
button:disabled{opacity:.45;cursor:default}
main{max-width:820px;margin:0 auto;padding:14px}
#drop{border:2px dashed #c9c5bb;border-radius:14px;background:var(--panel);padding:34px 16px;text-align:center;color:var(--mute)}
#drop.over{border-color:var(--acc);background:#eef0ff}
#drop b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.bar input[type=text]{flex:1;min-width:160px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
.bar select{font:inherit;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff}
ul{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li .s{color:var(--mute);font-size:12px;white-space:nowrap}
li button{padding:3px 9px}
.h{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.muted{color:var(--mute)}
#msg{margin:10px 0;color:var(--mute)}
progress{width:100%;height:8px}
</style>
</head>
<body>
<header><a href="../" target="_blank" rel="noopener" title="Accueil">‹ La Suite</a><h1>Zip</h1></header>
<main>
<div id="drop"><b>Glisse ici des fichiers, des dossiers ou un .zip</b>
  <span>Fichiers ordinaires → un .zip ; fichier .zip → son contenu</span><br><br>
  <button id="bFiles" class="pri">Choisir des fichiers…</button> <button id="bDir">Choisir un dossier…</button>
  <input type="file" id="fFiles" multiple hidden><input type="file" id="fDir" webkitdirectory hidden></div>
<div id="msg"></div>
<div id="secZip" hidden>
  <div class="h">À compresser <button id="bClear">Tout retirer</button></div>
  <ul id="lstAdd"></ul>
  <div class="bar"><input type="text" id="zName" value="archive" aria-label="Nom du fichier zip"><span class="muted">.zip</span>
    <select id="zLvl" title="Niveau de compression"><option value="6">Normale</option><option value="9">Maximale (plus lent)</option><option value="1">Rapide</option><option value="0">Sans compression</option></select>
    <button class="pri" id="bMake">Créer le zip</button></div>
</div>
<div id="secUn" hidden>
  <div class="h"><span id="unTitle">Contenu du zip</span> <button id="bAll" class="pri">Tout enregistrer dans un dossier…</button></div>
  <ul id="lstUn"></ul>
</div>
<progress id="pg" max="1" value="0" hidden></progress>
</main>
<script>
const $=s=>document.querySelector(s);
const fmt=n=>n<1024?n+' o':n<1048576?(n/1024).toFixed(1)+' Ko':(n/1048576).toFixed(1)+' Mo';
let ADD=[]; // {path,file}
let UN=null; // {name, files:{path:Uint8Array}}
function msg(t){$('#msg').textContent=t||'';}
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);}
function renderAdd(){
  $('#secZip').hidden=!ADD.length;const ul=$('#lstAdd');ul.innerHTML='';
  ADD.forEach((a,i)=>{const li=document.createElement('li');li.innerHTML='<span class="n"></span><span class="s">'+fmt(a.file.size)+'</span><button title="Retirer">✕</button>';
    li.querySelector('.n').textContent=a.path;li.querySelector('button').onclick=()=>{ADD.splice(i,1);renderAdd();};ul.appendChild(li);});
  if(ADD.length&&$('#zName').dataset.auto!=='0'){const first=ADD[0].path.split('/')[0].replace(/\.[^.]*$/,'');$('#zName').value=(ADD.length>1&&!ADD[0].path.includes('/'))?'archive':first||'archive';}
}
function renderUn(){
  $('#secUn').hidden=!UN;if(!UN)return;const ul=$('#lstUn');ul.innerHTML='';
  $('#unTitle').textContent=UN.name+' — '+Object.keys(UN.files).length+' fichier(s)';
  Object.keys(UN.files).sort().forEach(p=>{const d=UN.files[p];const li=document.createElement('li');
    li.innerHTML='<span class="n"></span><span class="s">'+fmt(d.length)+'</span><button>Télécharger</button>';
    li.querySelector('.n').textContent=p;li.querySelector('button').onclick=()=>save(new Blob([d]),p.split('/').pop());ul.appendChild(li);});
}
async function readEntry(e,base,out){
  if(e.isFile){await new Promise(r=>e.file(f=>{out.push({path:base+e.name,file:f});r();},r));}
  else if(e.isDirectory){const rd=e.createReader();let all=[];for(;;){const b=await new Promise(r=>rd.readEntries(r,()=>r([])));if(!b.length)break;all=all.concat(b);}
    for(const c of all)await readEntry(c,base+e.name+'/',out);}
}
async function take(items){
  const files=[];
  for(const it of items){if(it.entry)await readEntry(it.entry,'',files);else files.push({path:it.file.webkitRelativePath||it.file.name,file:it.file});}
  if(!files.length)return;
  // un seul .zip → décompresser
  if(files.length===1&&/\.zip$/i.test(files[0].path)){return unzipFile(files[0].file);}
  ADD=ADD.concat(files.filter(f=>!ADD.some(a=>a.path===f.path)));UN=null;renderUn();renderAdd();msg('');
}
async function unzipFile(f){
  msg('Lecture de '+f.name+'…');
  try{const buf=new Uint8Array(await f.arrayBuffer());const files=fflate.unzipSync(buf);
    for(const k of Object.keys(files))if(k.endsWith('/'))delete files[k];
    UN={name:f.name,files};ADD=[];renderAdd();renderUn();msg('');}
  catch(e){msg('Impossible de lire ce fichier : '+(e.message||e)+' (zip protégé par mot de passe, ou autre format que zip ?)');}
}
async function makeZip(){
  $('#bMake').disabled=true;const pg=$('#pg');pg.hidden=false;pg.value=0;msg('Compression…');
  try{const lvl=+$('#zLvl').value;const data={};let i=0;
    for(const a of ADD){data[a.path]=[new Uint8Array(await a.file.arrayBuffer()),{level:lvl}];pg.value=(++i)/ADD.length*.5;await new Promise(r=>setTimeout(r));}
    const out=await new Promise((res,rej)=>fflate.zip(data,(e,d)=>e?rej(e):res(d)));
    pg.value=1;const total=ADD.reduce((s,a)=>s+a.file.size,0);
    save(new Blob([out],{type:'application/zip'}),($('#zName').value.trim()||'archive')+'.zip');
    msg('Zip créé : '+fmt(total)+' → '+fmt(out.length)+(total?' ('+Math.round(100-out.length/total*100)+' % de gagné)':''));
  }catch(e){msg('Erreur : '+(e.message||e));}
  $('#bMake').disabled=false;setTimeout(()=>{pg.hidden=true;},800);
}
async function allUnzipped(){
  // télécharge tout en un seul zip reconstruit sans le dossier racine commun ? simple : fichier par fichier si peu, sinon un zip
  const ks=Object.keys(UN.files);
  if(ks.length===1){save(new Blob([UN.files[ks[0]]]),ks[0].split('/').pop());return;}
  // File System Access : choisir un dossier de destination (ordinateur)
  if(window.showDirectoryPicker){
    try{const root=await showDirectoryPicker({mode:'readwrite'});
      for(const p of ks){const parts=p.split('/');let d=root;for(const s of parts.slice(0,-1))d=await d.getDirectoryHandle(s,{create:true});
        const fh=await d.getFileHandle(parts[parts.length-1],{create:true});const w=await fh.createWritable();await w.write(UN.files[p]);await w.close();}
      msg('Fichiers écrits dans le dossier choisi.');return;}catch(e){if(e&&e.name==='AbortError')return;}
  }
  msg('Ce navigateur ne peut pas écrire un dossier : utilise « Télécharger » fichier par fichier.');
}
$('#bFiles').onclick=()=>$('#fFiles').click();$('#bDir').onclick=()=>$('#fDir').click();
$('#fFiles').onchange=e=>{take([...e.target.files].map(f=>({file:f})));e.target.value='';};
$('#fDir').onchange=e=>{take([...e.target.files].map(f=>({file:f})));e.target.value='';};
$('#bClear').onclick=()=>{ADD=[];renderAdd();msg('');};
$('#bMake').onclick=makeZip;$('#bAll').onclick=allUnzipped;
$('#zName').oninput=e=>{e.target.dataset.auto='0';};
const dz=$('#drop');
['dragenter','dragover'].forEach(t=>addEventListener(t,e=>{e.preventDefault();dz.classList.add('over');}));
['dragleave','drop'].forEach(t=>addEventListener(t,e=>{e.preventDefault();if(t==='drop'||e.target===document.documentElement)dz.classList.remove('over');}));
addEventListener('drop',e=>{const its=[...(e.dataTransfer.items||[])].filter(i=>i.kind==='file');
  if(its.length&&its[0].webkitGetAsEntry)take(its.map(i=>({entry:i.webkitGetAsEntry(),file:i.getAsFile()})));else take([...e.dataTransfer.files].map(f=>({file:f})));});
</script>
<script>if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(r=>r.update()).catch(()=>{}));
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__laSuiteBusy&&!sessionStorage.getItem('atelier-maj')){try{sessionStorage.setItem('atelier-maj','1');}catch(e){}window.__laSuiteLeaving=1;location.reload();}});}</script>
</body>
</html>
