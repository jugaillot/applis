<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C2410C">
<title>Mon espace — La Raffinerie</title>
<link rel="icon" href="/icons/raffinerie-icon-192.png">
<link rel="apple-touch-icon" href="/icons/raffinerie-icon-192.png">
<link rel="manifest" href="/raffinerie/manifest.webmanifest" crossorigin="use-credentials">
<script>
/* l'invite d'installation peut arriver avant que le code de l'appli soit chargé : on la garde */
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__bip=e;});
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(r=>r.update()).catch(()=>{}));
navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!sessionStorage.getItem('atelier-maj')){try{sessionStorage.setItem('atelier-maj','1');}catch(e){}location.reload();}});}
</script>
<script src="../lib/sync.js"></script>
<style>
html,body{margin:0;background:#FBF7F0;color:#1A1815;font-family:'Outfit',system-ui,sans-serif}
#root{width:100%;min-height:100vh;position:relative}
.rasp{max-width:420px;margin:0 auto;padding:max(40px,env(safe-area-inset-top)) 20px 30px}
.rasp h1{font-size:24px;margin:0 0 6px}
.rasp p{font-size:14px;color:#8A7E6B;line-height:1.45;margin:0 0 16px}
.rasp label{display:block;font-size:12px;font-weight:700;color:#8A7E6B;margin:12px 0 4px}
.rasp input{width:100%;box-sizing:border-box;padding:13px 14px;border-radius:12px;border:1px solid #E2D8C5;background:#fff;font-size:15px;font-family:inherit}
.rasp button{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:#C2410C;color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
.rasp .err{margin-top:12px;padding:10px 12px;border-radius:10px;background:#FEE2E2;color:#991B1B;font-size:13px}
.rasp .sub{background:none;color:#8A7E6B;font-size:13px;font-weight:600;text-decoration:underline;margin-top:8px}
</style>
</head>
<body><div id="root"></div>
<script>
(function(){
 window.RASP_PWA=true;
 var root=document.getElementById('root');
 var cfg=null;
 var KEYC='rasp_cfg',KEYK='rasp_code';
 function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
 function withTimeout(p,ms){return Promise.race([p,new Promise(function(r){setTimeout(function(){r(null);},ms);})]);}
 function msg(t,sub){root.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;gap:14px"><div style="font-weight:700;font-size:18px">La Raffinerie</div><div style="color:#8A7E6B;font-size:13px;text-align:center;padding:0 24px">'+esc(t)+'</div>'+(sub||'<div style="width:44px;height:44px;border:3px solid #EFE7D8;border-top-color:#C2410C;border-radius:50%;animation:rsp 1s linear infinite"></div>')+'</div><style>@keyframes rsp{to{transform:rotate(360deg)}}</style>';}

 /* ---- réglages (adresse de la passerelle + code d'accès), enregistrés sur l'appareil et sur le serveur ---- */
 function saveCfg(c){
  try{localStorage.setItem(KEYC,JSON.stringify(c));}catch(e){}
  try{if(window.AtelierSync)AtelierSync.save('reglages','reglages.raffinerie','Mon espace — passerelle',c);}catch(e){}
 }
 function loadCfg(){
  var local=null;try{local=JSON.parse(localStorage.getItem(KEYC)||'null');}catch(e){}
  if(local&&local.url&&local.k)return Promise.resolve(local);
  if(!window.AtelierSync)return Promise.resolve(null);
  return withTimeout(AtelierSync.load('reglages.raffinerie').catch(function(){return null;}),3000).then(function(c){
   if(c&&c.url&&c.k){try{localStorage.setItem(KEYC,JSON.stringify(c));}catch(e){}return c;}return null;
  });
 }
 function askCfg(prefill,err){
  prefill=prefill||{};
  root.innerHTML='<div class="rasp"><h1>Mon espace</h1><p>Première ouverture sur cet appareil : renseigne la passerelle (une seule fois, c’est ensuite mémorisé sur ton compte).</p>'+
   '<label>Adresse de la passerelle</label><input id="rUrl" type="url" placeholder="https://n8n.tierslieux.re/webhook/mon-espace" value="'+esc(prefill.url||'')+'">'+
   '<label>Code d’accès</label><input id="rK" type="password" autocomplete="off" value="'+esc(prefill.k||'')+'">'+
   (err?'<div class="err">'+esc(err)+'</div>':'')+
   '<button id="rGo">Enregistrer</button></div>';
  document.getElementById('rGo').onclick=function(){
   var u=document.getElementById('rUrl').value.trim(),k=document.getElementById('rK').value.trim();
   if(!/^https:\/\//.test(u)||!k){askCfg({url:u,k:k},'Adresse (https://…) et code d’accès obligatoires.');return;}
   cfg={url:u,k:k};
   msg('Vérification…');
   call({op:'fetch',table:'Appli_code'}).then(function(){saveCfg(cfg);start();}).catch(function(e){askCfg({url:u,k:k},'Impossible de joindre Grist : '+(e&&e.message?e.message:e));});
  };
 }
 window.RASP_RESET=function(){askCfg(cfg||{});};

 /* ---- passerelle : même interface que le widget (grist.docApi) ---- */
 function call(body){
  return fetch(cfg.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({k:cfg.k},body))}).then(function(r){
   return r.json().catch(function(){return {error:'Réponse illisible (HTTP '+r.status+')'};}).then(function(j){
    if(!r.ok||(j&&j.error&&!j.retValues))throw new Error((j&&j.error)||('HTTP '+r.status));
    return j;
   });
  });
 }
 window.grist={
  ready:function(){},onRecords:function(){},onRecord:function(){},
  docApi:{
   fetchTable:function(t){return call({op:'fetch',table:t});},
   applyUserActions:function(a){return call({op:'apply',actions:a});}
  }
 };

 /* ---- code de l'appli : lu dans Grist (Appli_code.Code et Usages.Code_Chantier), copie gardée pour le hors connexion ---- */
 function firstCell(t,col){var v=t&&t[col];if(!v)return '';for(var i=0;i<v.length;i++){if(v[i])return String(v[i]);}return '';}
 function fetchCode(){
  return Promise.all([call({op:'fetch',table:'Appli_code'}),call({op:'fetch',table:'Usages'})]).then(function(r){
   var c={app:firstCell(r[0],'Code'),deck:firstCell(r[1],'Code_Chantier'),ts:Date.now()};
   if(c.app.length<1000)throw new Error('Code de l’appli introuvable dans Grist');
   try{localStorage.setItem(KEYK,JSON.stringify(c));}catch(e){}
   return c;
  });
 }
 function cachedCode(){try{var c=JSON.parse(localStorage.getItem(KEYK)||'null');return c&&c.app?c:null;}catch(e){return null;}}
 function run(code){
  [code.deck,code.app].forEach(function(src){
   if(!src)return;
   var s=document.createElement('script');s.textContent=src;document.body.appendChild(s);
  });
 }
 function start(){
  msg('Chargement…');
  var cache=cachedCode();
  var fresh=withTimeout(fetchCode().catch(function(e){return {err:e};}),cache?5000:25000);
  fresh.then(function(c){
   if(c&&c.app){run(c);return;}
   if(cache){run(cache);return;}
   var m=(c&&c.err&&c.err.message)||'Pas de réponse de la passerelle';
   root.innerHTML='<div class="rasp"><h1>Mon espace</h1><div class="err">'+esc(m)+'</div><button id="rRe">Réessayer</button><button class="sub" id="rCfg">Changer la passerelle</button></div>';
   document.getElementById('rRe').onclick=start;
   document.getElementById('rCfg').onclick=function(){askCfg(cfg);};
  });
 }
 loadCfg().then(function(c){if(c){cfg=c;start();}else askCfg();});
})();
</script>
</body></html>
